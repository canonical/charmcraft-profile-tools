name: Integration tests

on:
  pull_request:
    paths:
      - kubernetes-extra/**
      - machine/**
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  integration-kubernetes-extra:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-kubernetes-extra
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - name: Install Concierge
        run: sudo snap install --classic concierge
      - name: Prepare for deploying K8s charms
        run: sudo concierge prepare -p microk8s
      - name: Pack charm
        working-directory: kubernetes-extra
        run: |
          charmcraft pack
      - name: Run integration tests
        working-directory: kubernetes-extra
        run: |
          tox -e integration
      - name: Check handling of .charm files
        working-directory: kubernetes-extra
        run: |
          cp *.charm foo.charm
          CHARM_PATH=foo.charm tox -e integration
          ! CHARM_PATH=bar.charm tox -e integration  # Fails because bar.charm doesn't exist.
          ! tox -e integration  # Fails because there's more than one .charm file.
          rm *.charm
          ! tox -e integration  # Fails because there are no .charm files.

  integration-machine:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-machine
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - name: Install Concierge
        run: sudo snap install --classic concierge
      - name: Prepare for deploying machine charms
        run: sudo concierge prepare -p machine
      - name: Pack charm
        working-directory: machine
        run: |
          charmcraft pack
      - name: Run integration tests
        working-directory: machine
        run: |
          uvx --python 3.10 --with tox-uv tox -e integration
      - name: Check handling of .charm files
        working-directory: machine
        run: |
          cp *.charm foo.charm
          CHARM_PATH=foo.charm uvx --python 3.10 --with tox-uv tox -e integration
          # Expect failure if we specify a .charm file that doesn't exist.
          ! CHARM_PATH=bar.charm uvx --python 3.10 --with tox-uv tox -e Integration
          # Expect failure if there's more than one .charm file.
          ! uvx --python 3.10 --with tox-uv tox -e integration
          # Expect failure if there are no .charm files.
          rm *.charm
          ! uvx --python 3.10 --with tox-uv tox -e integration
